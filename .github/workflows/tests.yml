name: Pipeline regression checks

on:
  pull_request:
  push:
    branches: [dev, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-pipeline.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n run.sh
