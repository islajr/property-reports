name: Monthly Market Report

on:
  schedule:
    # First day of each month at 06:00 WAT (05:00 UTC)
    - cron: '0 5 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Reporting month (YYYY-MM). Defaults to prior calendar month.'
        required: false
        type: string
      issue_number:
        description: 'Issue number override (optional).'
        required: false
        type: string
      skip_pdf:
        description: 'Skip PDF generation'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: monthly-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-report:
    name: Generate & Publish Report
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 \
            libcairo2 libffi-dev libxml2 libxslt1.1

      - name: Determine reporting month
        id: month
        env:
          REQUESTED_MONTH: ${{ github.event.inputs.month }}
        run: |
          REPORT_MONTH="$REQUESTED_MONTH"
          if [ -z "$REPORT_MONTH" ]; then
            REPORT_MONTH=$(date -d "$(date +%Y-%m-01) -1 day" +'%Y-%m')
          fi
          python -c 'import sys; from scripts.report_identity import report_key; report_key(sys.argv[1])' "$REPORT_MONTH"
          echo "month=$REPORT_MONTH" >> "$GITHUB_OUTPUT"

      - name: Build report
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPORT_MONTH: ${{ steps.month.outputs.month }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          SKIP_PDF: ${{ github.event.inputs.skip_pdf || 'false' }}
        run: |
          args=(--month "$REPORT_MONTH" --export)
          if [ -n "$ISSUE_NUMBER" ]; then args+=(--issue "$ISSUE_NUMBER"); fi
          if [ "$SKIP_PDF" = "true" ]; then args+=(--no-pdf); fi
          bash run.sh "${args[@]}"

      - name: Archive report inputs
        uses: actions/upload-artifact@v4
        with:
          name: report-inputs-${{ steps.month.outputs.month }}-${{ github.run_id }}
          path: |
            data/neighbourhood_snapshots.csv
            data/metrics_${{ steps.month.outputs.month }}.json
            data/narrative_${{ steps.month.outputs.month }}.json
            reports/${{ steps.month.outputs.month }}/meta.json
            requirements-pipeline.txt
          if-no-files-found: error
          retention-days: 90

      - name: Commit and push rendered report
        env:
          REPORT_MONTH: ${{ steps.month.outputs.month }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m "report: add $(date -d "${REPORT_MONTH}-01" +'%B %Y') market report"
            git push
          fi
